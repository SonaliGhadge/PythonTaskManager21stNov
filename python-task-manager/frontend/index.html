<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span><span>TaskFlow</span></div>
      <nav><a class="active" href="#">Dashboard</a></nav>
      <div class="sidebar-footer">Personal workspace</div>
    </aside>

    <section class="dashboard">
      <header class="topbar">
        <div><p class="eyebrow">My workspace</p><h1>Task Dashboard</h1></div>
        <button id="showFormButton" class="primary-button" type="button">+ New task</button>
      </header>

      <section id="taskFormSection" class="form-card hidden">
        <div class="form-heading"><h2>Create a task</h2><button id="closeFormButton" class="icon-button" type="button" aria-label="Close form">×</button></div>
        <form id="taskForm">
          <label>Title<input id="title" name="title" type="text" maxlength="120" placeholder="What needs to be done?" required></label>
          <label>Description<textarea id="description" name="description" maxlength="500" placeholder="Add helpful details"></textarea></label>
          <label>Status<select id="status" name="status"><option value="pending">Pending</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select></label>
          <div class="form-actions"><button class="secondary-button" id="cancelFormButton" type="button">Cancel</button><button class="primary-button" type="submit">Create task</button></div>
        </form>
      </section>

      <div id="alert" class="alert hidden" role="alert"></div>

      <section class="stats-grid">
        <article class="stat-card"><span>Total tasks</span><strong id="totalCount">0</strong></article>
        <article class="stat-card"><span>Pending</span><strong id="pendingCount">0</strong></article>
        <article class="stat-card"><span>In progress</span><strong id="progressCount">0</strong></article>
        <article class="stat-card"><span>Completed</span><strong id="completedCount">0</strong></article>
      </section>

      <section class="tasks-card">
        <div class="tasks-heading"><div><p class="eyebrow">All tasks</p><h2>Tasks</h2></div><button id="refreshButton" class="icon-button" type="button" aria-label="Refresh tasks">↻</button></div>
        <div id="loadingState" class="loading-state"><span class="spinner"></span> Loading tasks…</div>
        <div id="emptyState" class="empty-state hidden"><div class="empty-icon">✓</div><h3>No tasks yet</h3><p>Create your first task to get started.</p></div>
        <div id="taskTableWrapper" class="table-wrapper hidden">
          <table>
            <thead><tr><th>Task</th><th>Status</th><th>Created</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
